<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <linearGradient id="autoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181836"/>
      <stop offset="100%" stop-color="#101024"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="620" rx="10" fill="url(#autoBg)" stroke="#2D2D54" stroke-width="1.5"/>

  <!-- Top Bar -->
  <rect width="1000" height="50" rx="10" fill="#14142B"/>
  <rect y="40" width="1000" height="10" fill="#14142B"/>
  <line x1="0" y1="50" x2="1000" y2="50" stroke="#2D2D54" stroke-width="1"/>

  <text x="24" y="32" fill="#FFFFFF" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="700">DITEON WORKFLOWS &amp; APIS</text>
  <text x="245" y="32" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">/ Automatización de Notificaciones &amp; Webhooks</text>

  <rect x="740" y="12" width="110" height="26" rx="5" fill="#10B981" fill-opacity="0.15"/>
  <circle cx="755" cy="25" r="4" fill="#10B981"/>
  <text x="765" y="29" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Engine Activo</text>

  <rect x="865" y="12" width="115" height="26" rx="5" fill="#1C6FE0"/>
  <text x="878" y="29" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">+ Nuevo Flujo</text>

  <!-- Flow Diagram Canvas -->
  <rect x="24" y="66" width="952" height="530" rx="8" fill="#131326" stroke="#26264A" stroke-width="1"/>

  <!-- Workflow Title Header -->
  <text x="44" y="96" fill="#FFFFFF" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700">Flujo: Venta POS Confirmada ➔ Facturación SUNAT ➔ Notificación WhatsApp Cliente</text>
  <text x="44" y="112" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Ejecutado 1,482 veces en los últimos 30 días · 99.98% de tasa de éxito</text>

  <!-- Node 1: Trigger -->
  <g>
    <rect x="44" y="145" width="250" height="130" rx="8" fill="#1B1B38" stroke="#1C6FE0" stroke-width="1.5"/>
    <rect x="44" y="145" width="250" height="30" rx="8" fill="#1E2A4A"/>
    <text x="56" y="165" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⚡ DISPARADOR (WEBHOOK)</text>
    
    <text x="56" y="196" fill="#FFFFFF" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600">Nueva Venta Registrada</text>
    <text x="56" y="214" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Evento: pos.ticket.completed</text>
    
    <rect x="56" y="235" width="80" height="20" rx="4" fill="#10B981" fill-opacity="0.15"/>
    <text x="64" y="249" fill="#34D399" font-family="system-ui, sans-serif" font-size="9" font-weight="700">✓ Payload JSON</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="294" y1="210" x2="360" y2="210" stroke="#1C6FE0" stroke-width="2"/>
  <polygon points="360,205 370,210 360,215" fill="#1C6FE0"/>

  <!-- Node 2: Logic / Invoice -->
  <g>
    <rect x="370" y="145" width="260" height="130" rx="8" fill="#1B1B38" stroke="#7B61FF" stroke-width="1.5"/>
    <rect x="370" y="145" width="260" height="30" rx="8" fill="#2E204A"/>
    <text x="382" y="165" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⚙ ACCIÓN: FACTURACIÓN</text>
    
    <text x="382" y="196" fill="#FFFFFF" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600">Firmar XML &amp; Enviar a SUNAT</text>
    <text x="382" y="214" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Genera CDR oficial + PDF con QR</text>
    
    <rect x="382" y="235" width="95" height="20" rx="4" fill="#7B61FF" fill-opacity="0.2"/>
    <text x="390" y="249" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="9" font-weight="700">API PSE Certificado</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="630" y1="210" x2="696" y2="210" stroke="#10B981" stroke-width="2"/>
  <polygon points="696,205 706,210 696,215" fill="#10B981"/>

  <!-- Node 3: WhatsApp Notification -->
  <g>
    <rect x="706" y="145" width="250" height="130" rx="8" fill="#142B20" stroke="#10B981" stroke-width="1.5"/>
    <rect x="706" y="145" width="250" height="30" rx="8" fill="#193829"/>
    <text x="718" y="165" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">✉ SALIDA: WHATSAPP CLOUD API</text>
    
    <text x="718" y="196" fill="#FFFFFF" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600">Mensaje con Boleta Adjunta</text>
    <text x="718" y="214" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="11">Plantilla: &quot;Hola {{cliente}}, tu pedido...&quot;</text>
    
    <rect x="718" y="235" width="105" height="20" rx="4" fill="#10B981" fill-opacity="0.25"/>
    <text x="726" y="249" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="9" font-weight="700">✓ Entregado &lt; 2 seg</text>
  </g>

  <!-- Execution Logs Section at bottom -->
  <text x="44" y="325" fill="#FFFFFF" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700">Registro en Tiempo Real de Ejecuciones (Logs)</text>

  <rect x="44" y="340" width="912" height="42" rx="6" fill="#181834" stroke="#26264A" stroke-width="1"/>
  <circle cx="64" cy="361" r="4" fill="#10B981"/>
  <text x="80" y="365" fill="#34D399" font-family="monospace" font-size="11">[2026-08-28 14:21:04]</text>
  <text x="240" y="365" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Ticket #4921 ➔ SUNAT CDR: OK ➔ WhatsApp enviado a +51 984 *** 210</text>
  <text x="860" y="365" fill="#60A5FA" font-family="monospace" font-size="11">1,120 ms</text>

  <rect x="44" y="392" width="912" height="42" rx="6" fill="#181834" stroke="#26264A" stroke-width="1"/>
  <circle cx="64" cy="413" r="4" fill="#10B981"/>
  <text x="80" y="417" fill="#34D399" font-family="monospace" font-size="11">[2026-08-28 14:18:22]</text>
  <text x="240" y="417" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Ticket #4920 ➔ SUNAT CDR: OK ➔ WhatsApp enviado a +51 912 *** 884</text>
  <text x="860" y="417" fill="#60A5FA" font-family="monospace" font-size="11">980 ms</text>

  <rect x="44" y="444" width="912" height="42" rx="6" fill="#181834" stroke="#26264A" stroke-width="1"/>
  <circle cx="64" cy="465" r="4" fill="#10B981"/>
  <text x="80" y="469" fill="#34D399" font-family="monospace" font-size="11">[2026-08-28 14:12:09]</text>
  <text x="240" y="469" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Alerta Stock Bajo ➔ Correo a Compras + Notificación Telegram Almacén</text>
  <text x="860" y="469" fill="#60A5FA" font-family="monospace" font-size="11">450 ms</text>
</svg>
